<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nancy Grace Roman Space Telescope Tracker</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --accent: #4f46e5;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --interactive: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d3748;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 10px;
      color: #fff;
    }

    .metric {
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      font-size: 0.95rem;
      color: var(--subtext);
    }

    .value {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .clickable {
      color: var(--interactive);
      cursor: pointer;
      text-decoration: underline dotted;
      user-select: none;
      transition: color 0.2s;
    }

    .clickable:hover {
      color: #7dd3fc;
    }

    .status {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nancy Grace Roman Space Telescope</h1>

    <!-- Distance -->
    <div class="metric">
      <span class="label">Distance from Earth</span>
      <span class="value"><span id="dist-val">--</span> <span id="dist-unit" class="clickable" onclick="toggleDistance()">(km)</span></span>
    </div>

    <!-- Velocity -->
    <div class="metric">
      <span class="label">Radial Velocity</span>
      <span class="value"><span id="vel-val">--</span> <span id="vel-unit" class="clickable" onclick="toggleVelocity()">(km/h)</span></span>
    </div>

    <!-- Signal Delay -->
    <div class="metric">
      <span class="label">Signal Delay</span>
      <span class="value"><span id="time-val">--</span> <span id="time-unit" class="clickable" onclick="toggleLatency()">(one-way)</span></span>
    </div>

    <!-- Earth Rotation -->
    <div class="metric">
      <span class="label">Earth Rotation Speed</span>
      <span class="value"><span id="rot-val">--</span> <span id="rot-unit" class="clickable" onclick="toggleRotation()">(km/h)</span></span>
    </div>

    <div class="status" id="status">Fetching NASA Telemetry...</div>
  </div>

  <script>
    let rawDistanceKm = 0;
    let rawVelocityKms = 0;
    let rawLightTimeSec = 0;

    let isKm = true;
    let isKmh = true;
    let isOneWay = true;
    let isRotKmh = true;

    const EARTH_ROTATION_KMH = 1670; 
    const KM_TO_MILES = 0.621371;
    const SPEED_OF_LIGHT = 299792.458; // km/s

    async function fetchTelemetry() {
      const now = new Date();
      const nextMin = new Date(now.getTime() + 60000);

      // Horizons requires strict time string formats: 'YYYY-MM-DD HH:MM'
      const startStr = now.toISOString().replace('T', ' ').substring(0, 16);
      const stopStr = nextMin.toISOString().replace('T', ' ').substring(0, 16);

      const rawUrl = `https://ssd.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='-211'&OBJ_DATA='NO'&MAKE_EPHEM='YES'&EPHEM_TYPE='VECTORS'&CENTER='500@399'&START_TIME='${startStr}'&STOP_TIME='${stopStr}'&STEP_SIZE='1m'`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rawUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        const wrapper = await res.json();
        const data = JSON.parse(wrapper.contents);

        if (data && data.result) {
          const text = data.result;

          // Parse vector components X, Y, Z and VX, VY, VZ from Horizons output block
          const xMatch = text.match(/X\s*=\s*([0-9.E+-]+)/);
          const yMatch = text.match(/Y\s*=\s*([0-9.E+-]+)/);
          const zMatch = text.match(/Z\s*=\s*([0-9.E+-]+)/);
          const vxMatch = text.match(/VX\s*=\s*([0-9.E+-]+)/);
          const vyMatch = text.match(/VY\s*=\s*([0-9.E+-]+)/);
          const vzMatch = text.match(/VZ\s*=\s*([0-9.E+-]+)/);

          if (xMatch && yMatch && zMatch && vxMatch && vyMatch && vzMatch) {
            const x = parseFloat(xMatch[1]);
            const y = parseFloat(yMatch[1]);
            const z = parseFloat(zMatch[1]);
            const vx = parseFloat(vxMatch[1]);
            const vy = parseFloat(vyMatch[1]);
            const vz = parseFloat(vzMatch[1]);

            // Euclidean distance r = sqrt(x^2 + y^2 + z^2)
            rawDistanceKm = Math.sqrt(x*x + y*y + z*z);
            // Radial velocity = (x*vx + y*vy + z*vz) / r
            rawVelocityKms = Math.abs((x*vx + y*vy + z*vz) / rawDistanceKm);
            // Light travel time = distance / c
            rawLightTimeSec = rawDistanceKm / SPEED_OF_LIGHT;

            document.getElementById('status').innerText = "Live NASA Telemetry Loaded";
            renderAll();
            return;
          }
        }
        document.getElementById('status').innerText = "Parsing Error - Verify Telescope Trajectory Data";
      } catch (err) {
        document.getElementById('status').innerText = "Failed to Fetch Live Data";
      }
    }

    function renderAll() {
      const dist = isKm ? rawDistanceKm : rawDistanceKm * KM_TO_MILES;
      document.getElementById('dist-val').innerText = Math.round(dist).toLocaleString();
      document.getElementById('dist-unit').innerText = isKm ? "(km)" : "(miles)";

      const velKmh = rawVelocityKms * 3600;
      const vel = isKmh ? velKmh : velKmh * KM_TO_MILES;
      document.getElementById('vel-val').innerText = Math.round(vel).toLocaleString();
      document.getElementById('vel-unit').innerText = isKmh ? "(km/h)" : "(mph)";

      const ms = rawLightTimeSec * 1000;
      const delay = isOneWay ? ms : ms * 2;
      document.getElementById('time-val').innerText = Math.round(delay).toLocaleString() + " ms";
      document.getElementById('time-unit').innerText = isOneWay ? "(one-way)" : "(roundtrip)";

      const rot = isRotKmh ? EARTH_ROTATION_KMH : EARTH_ROTATION_KMH * KM_TO_MILES;
      document.getElementById('rot-val').innerText = Math.round(rot).toLocaleString();
      document.getElementById('rot-unit').innerText = isRotKmh ? "(km/h)" : "(mph)";
    }

    function toggleDistance() { isKm = !isKm; renderAll(); }
    function toggleVelocity() { isKmh = !isKmh; renderAll(); }
    function toggleLatency() { isOneWay = !isOneWay; renderAll(); }
    function toggleRotation() { isRotKmh = !isRotKmh; renderAll(); }

    fetchTelemetry();
  </script>
</body>
</html>
