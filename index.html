<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nancy Grace Roman Space Telescope Tracker</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --accent: #4f46e5;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --interactive: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d3748;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 10px;
      color: #fff;
    }

    .metric {
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      font-size: 0.95rem;
      color: var(--subtext);
    }

    .value {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .clickable {
      color: var(--interactive);
      cursor: pointer;
      text-decoration: underline dotted;
      user-select: none;
      transition: color 0.2s;
    }

    .clickable:hover {
      color: #7dd3fc;
    }

    .status {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nancy Grace Roman Space Telescope</h1>

    <!-- Distance -->
    <div class="metric">
      <span class="label">Distance from Earth</span>
      <span class="value"><span id="dist-val">--</span> <span id="dist-unit" class="clickable" onclick="toggleDistance()">(km)</span></span>
    </div>

    <!-- Velocity -->
    <div class="metric">
      <span class="label">Radial Velocity</span>
      <span class="value"><span id="vel-val">--</span> <span id="vel-unit" class="clickable" onclick="toggleVelocity()">(km/h)</span></span>
    </div>

    <!-- Signal Delay -->
    <div class="metric">
      <span class="label">Signal Delay</span>
      <span class="value"><span id="time-val">--</span> <span id="time-unit" class="clickable" onclick="toggleLatency()">(one-way)</span></span>
    </div>

    <!-- Earth Rotation -->
    <div class="metric">
      <span class="label">Earth Rotation Speed</span>
      <span class="value"><span id="rot-val">--</span> <span id="rot-unit" class="clickable" onclick="toggleRotation()">(km/h)</span></span>
    </div>

    <div class="status" id="status">Fetching NASA Telemetry...</div>
  </div>

  <script>
    // Standard L2 orbit baseline defaults if network fails
    let rawDistanceKm = 1500000;
    let rawVelocityKms = 0.25;
    let rawLightTimeSec = 5.0;

    let isKm = true;
    let isKmh = true;
    let isOneWay = true;
    let isRotKmh = true;

    const EARTH_ROTATION_KMH = 1670; 
    const KM_TO_MILES = 0.621371;
    const AU_TO_KM = 149597870.7;

    async function fetchTelemetry() {
      const now = new Date();
      const startStr = now.toISOString().split('T')[0];
      
      const tomorrow = new Date(now.getTime() + 86400000);
      const stopStr = tomorrow.toISOString().split('T')[0];

      // Observer ephemeris request (QUANTITIES=20 gets Range & Range-Rate)
      const rawUrl = `https://ssd.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='-211'&OBJ_DATA='NO'&MAKE_EPHEM='YES'&EPHEM_TYPE='OBSERVER'&CENTER='500@399'&START_TIME='${startStr}'&STOP_TIME='${stopStr}'&STEP_SIZE='1d'&QUANTITIES='20'`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rawUrl)}`;

      try {
        const res = await fetch(proxyUrl);
        const wrapper = await res.json();
        const data = JSON.parse(wrapper.contents);

        if (data && data.result) {
          const text = data.result;
          
          // Match target range (AU) and range-rate (km/s) from Horizons table block
          const tableMatch = text.match(/\$\$SOE[\s\S]*?\$\$EOE/);
          if (tableMatch) {
            const row = tableMatch[0].split('\n')[1] || tableMatch[0].split('\n')[0];
            const numbers = row.match(/[-+]?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?/g);
            
            if (numbers && numbers.length >= 2) {
              // Horizons Quantity 20 outputs Range (AU) and Range-Rate (km/s)
              const rangeAU = parseFloat(numbers[numbers.length - 2]);
              const rangeRateKms = parseFloat(numbers[numbers.length - 1]);

              if (!isNaN(rangeAU) && !isNaN(rangeRateKms)) {
                rawDistanceKm = rangeAU * AU_TO_KM;
                rawVelocityKms = Math.abs(rangeRateKms);
                rawLightTimeSec = rawDistanceKm / 299792.458;

                document.getElementById('status').innerText = "Live NASA Telemetry Loaded";
                renderAll();
                return;
              }
            }
          }
        }
        document.getElementById('status').innerText = "Using Baseline Trajectory Data";
        renderAll();
      } catch (err) {
        document.getElementById('status').innerText = "Using Baseline Trajectory Data";
        renderAll();
      }
    }

    function renderAll() {
      const dist = isKm ? rawDistanceKm : rawDistanceKm * KM_TO_MILES;
      document.getElementById('dist-val').innerText = Math.round(dist).toLocaleString();
      document.getElementById('dist-unit').innerText = isKm ? "(km)" : "(miles)";

      const velKmh = rawVelocityKms * 3600;
      const vel = isKmh ? velKmh : velKmh * KM_TO_MILES;
      document.getElementById('vel-val').innerText = Math.round(vel).toLocaleString();
      document.getElementById('vel-unit').innerText = isKmh ? "(km/h)" : "(mph)";

      const ms = rawLightTimeSec * 1000;
      const delay = isOneWay ? ms : ms * 2;
      document.getElementById('time-val').innerText = Math.round(delay).toLocaleString() + " ms";
      document.getElementById('time-unit').innerText = isOneWay ? "(one-way)" : "(roundtrip)";

      const rot = isRotKmh ? EARTH_ROTATION_KMH : EARTH_ROTATION_KMH * KM_TO_MILES;
      document.getElementById('rot-val').innerText = Math.round(rot).toLocaleString();
      document.getElementById('rot-unit').innerText = isRotKmh ? "(km/h)" : "(mph)";
    }

    function toggleDistance() { isKm = !isKm; renderAll(); }
    function toggleVelocity() { isKmh = !isKmh; renderAll(); }
    function toggleLatency() { isOneWay = !isOneWay; renderAll(); }
    function toggleRotation() { isRotKmh = !isRotKmh; renderAll(); }

    fetchTelemetry();
  </script>
</body>
</html>
