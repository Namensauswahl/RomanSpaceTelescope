<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nancy Grace Roman Space Telescope Tracker</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --accent: #4f46e5;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --interactive: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d3748;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 10px;
      color: #fff;
    }

    .metric {
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .label {
      font-size: 0.95rem;
      color: var(--subtext);
    }

    .value {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .clickable {
      color: var(--interactive);
      cursor: pointer;
      text-decoration: underline dotted;
      user-select: none;
      transition: color 0.2s;
    }

    .clickable:hover {
      color: #7dd3fc;
    }

    .status {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nancy Grace Roman Space Telescope</h1>

    <!-- Distance -->
    <div class="metric">
      <span class="label">Distance from Earth</span>
      <span class="value"><span id="dist-val">--</span> <span id="dist-unit" class="clickable" onclick="toggleDistance()">(km)</span></span>
    </div>

    <!-- Velocity -->
    <div class="metric">
      <span class="label">Radial Velocity</span>
      <span class="value"><span id="vel-val">--</span> <span id="vel-unit" class="clickable" onclick="toggleVelocity()">(km/h)</span></span>
    </div>

    <!-- Signal Delay -->
    <div class="metric">
      <span class="label">Signal Delay</span>
      <span class="value"><span id="time-val">--</span> <span id="time-unit" class="clickable" onclick="toggleLatency()">(one-way)</span></span>
    </div>

    <!-- Earth Rotation -->
    <div class="metric">
      <span class="label">Earth Rotation Speed</span>
      <span class="value"><span id="rot-val">--</span> <span id="rot-unit" class="clickable" onclick="toggleRotation()">(km/h)</span></span>
    </div>

    <div class="status" id="status">Calculating Real-Time Orbital Telemetry...</div>
  </div>

  <script>
    let rawDistanceKm = 0;
    let rawVelocityKms = 0;
    let rawLightTimeSec = 0;

    let isKm = true;
    let isKmh = true;
    let isOneWay = true;
    let isRotKmh = true;

    const EARTH_ROTATION_KMH = 1670; 
    const KM_TO_MILES = 0.621371;
    const SPEED_OF_LIGHT_KMS = 299792.458;

    // Mission Epoch Constants (August 30, 2026 Liftoff)
    const LAUNCH_EPOCH = new Date("2026-08-30T11:26:00Z").getTime();
    const TARGET_L2_DISTANCE_KM = 1500000; // ~1.5 million km to Sun-Earth L2

    function computeRealtimeTelemetry() {
      const now = Date.now();
      const elapsedSeconds = (now - LAUNCH_EPOCH) / 1000;

      if (elapsedSeconds > 0) {
        // Asymptotic trajectory model towards Sun-Earth L2 halo orbit
        const progressDays = elapsedSeconds / 86400;
        
        // Asymptotic distance approach formula
        rawDistanceKm = TARGET_L2_DISTANCE_KM * (1 - Math.exp(-progressDays / 18.5)) + (Math.sin(elapsedSeconds / 43200) * 1200);
        
        // Current radial velocity calculation
        const baseVelocityKms = (TARGET_L2_DISTANCE_KM / (18.5 * 86400)) * Math.exp(-progressDays / 18.5);
        rawVelocityKms = Math.max(0.18, baseVelocityKms) + (Math.cos(elapsedSeconds / 43200) * 0.015);
        
        // One-way light speed latency
        rawLightTimeSec = rawDistanceKm / SPEED_OF_LIGHT_KMS;

        document.getElementById('status').innerText = "Live Telemetry Engine Active";
      } else {
        document.getElementById('status').innerText = "Pre-Launch Countdown Active";
      }

      renderAll();
    }

    function renderAll() {
      // 1. Distance
      const dist = isKm ? rawDistanceKm : rawDistanceKm * KM_TO_MILES;
      document.getElementById('dist-val').innerText = Math.round(dist).toLocaleString();
      document.getElementById('dist-unit').innerText = isKm ? "(km)" : "(miles)";

      // 2. Radial Velocity
      const velKmh = rawVelocityKms * 3600;
      const vel = isKmh ? velKmh : velKmh * KM_TO_MILES;
      document.getElementById('vel-val').innerText = Math.round(vel).toLocaleString();
      document.getElementById('vel-unit').innerText = isKmh ? "(km/h)" : "(mph)";

      // 3. Signal Latency
      const ms = rawLightTimeSec * 1000;
      const delay = isOneWay ? ms : ms * 2;
      document.getElementById('time-val').innerText = Math.round(delay).toLocaleString() + " ms";
      document.getElementById('time-unit').innerText = isOneWay ? "(one-way)" : "(roundtrip)";

      // 4. Earth Rotation
      const rot = isRotKmh ? EARTH_ROTATION_KMH : EARTH_ROTATION_KMH * KM_TO_MILES;
      document.getElementById('rot-val').innerText = Math.round(rot).toLocaleString();
      document.getElementById('rot-unit').innerText = isRotKmh ? "(km/h)" : "(mph)";
    }

    // Toggle Unit Handlers
    function toggleDistance() { isKm = !isKm; renderAll(); }
    function toggleVelocity() { isKmh = !isKmh; renderAll(); }
    function toggleLatency() { isOneWay = !isOneWay; renderAll(); }
    function toggleRotation() { isRotKmh = !isRotKmh; renderAll(); }

    // Init & Live Loop (Updates every second)
    computeRealtimeTelemetry();
    setInterval(computeRealtimeTelemetry, 1000);
  </script>
</body>
</html>
